<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardito Lee</title>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f8ff;
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }

        #app {
            text-align: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-char {
            font-family: 'Andika', sans-serif; /* Specially designed for literacy: 'I' has top/bottom bars, 'l' has a curved tail */
            font-size: clamp(8rem, 25vw, 15rem);
            font-weight: 700;
            color: #ff4500;
            transition: transform 0.2s;
            line-height: 1.1;
        }

        .examples-container {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }

        .example-item {
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 24px 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .example-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        }

        .emoji {
            font-size: clamp(3.5rem, 6.5vw, 6rem);
            display: block;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        .word {
            font-size: clamp(1.5rem, 2.5vw, 2.3rem);
            color: #2e8b57;
            text-transform: capitalize;
            font-weight: 700;
            display: block;
            word-break: break-word;
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            width: 100%;
            color: #888;
            font-size: 1.2rem;
            text-align: center;
            font-weight: 700;
            pointer-events: none;
        }

        @media (max-width: 850px) {
            .examples-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .example-item {
                padding: 16px 8px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="display" class="main-char">?</div>
    
    <div id="examples" class="examples-container">
        <div class="example-item" id="item1">
            <span id="emoji1" class="emoji"></span>
            <span id="word1" class="word"></span>
        </div>
        <div class="example-item" id="item2">
            <span id="emoji2" class="emoji"></span>
            <span id="word2" class="word"></span>
        </div>
        <div class="example-item" id="item3">
            <span id="emoji3" class="emoji"></span>
            <span id="word3" class="word"></span>
        </div>
        <div class="example-item" id="item4">
            <span id="emoji4" class="emoji"></span>
            <span id="word4" class="word"></span>
        </div>
    </div>
</div>

<div class="instructions">Tryk på skærmen for at starte!</div>

<script>
    const data = {
        // Danish alphabet A-Å (4 words and emojis per letter)
        'A': { words: ['Ananas', 'And', 'Agurk', 'Avocado'], emojis: ['🍍', '🦆', '🥒', '🥑'] },
        'B': { words: ['Banan', 'Bjørn', 'Blomst', 'Bi'], emojis: ['🍌', '🐻', '🌸', '🐝'] },
        'C': { words: ['Cirkus', 'Cowboy', 'Croissant', 'Cookie'], emojis: ['🎪', '🤠', '🥐', '🍪'] },
        'D': { words: ['Dinosaur', 'Dronning', 'Due', 'Dør'], emojis: ['🦖', '👑', '🕊️', '🚪'] },
        'E': { words: ['Enhjørning', 'Edderkop', 'Elg', 'Engel'], emojis: ['🦄', '🕷️', '🫎', '👼'] },
        'F': { words: ['Fugl', 'Frø', 'Får', 'Flag'], emojis: ['🐦', '🐸', '🐑', '🇩🇰'] },
        'G': { words: ['Giraf', 'Gris', 'Guitar', 'Gås'], emojis: ['🦒', '🐷', '🎸', '🪿'] },
        'H': { words: ['Hund', 'Hjerte', 'Hat', 'Hval'], emojis: ['🐶', '❤️', '🎩', '🐳'] },
        'I': { words: ['Isbjørn', 'Iglo', 'Insekt', 'Instrument'], emojis: ['🐻‍❄️', '🛖', '🪲', '🎺'] },
        'J': { words: ['Jaguar', 'Jakke', 'Juvel', 'Juletræ'], emojis: ['🐆', '🧥', '💎', '🎄'] },
        'K': { words: ['Kanin', 'Krabbe', 'Krone', 'Krokodille'], emojis: ['🐰', '🦀', '👑', '🐊'] },
        'L': { words: ['Lastbil', 'Lyn', 'Lås', 'Løg'], emojis: ['🚛', '⚡', '🔒', '🧅'] },
        'M': { words: ['Mælk', 'Myre', 'Motorcykel', 'Melon'], emojis: ['🥛', '🐜', '🏍️', '🍉'] },
        'N': { words: ['Næse', 'Nød', 'Nisse', 'Nål'], emojis: ['👃', '🥜', '🧑‍🎄', '🪡'] },
        'O': { words: ['Odder', 'Orangutang', 'Oliven', 'Otte'], emojis: ['🦦', '🦧', '🫒', '8️⃣'] },
        'P': { words: ['Panda', 'Pizza', 'Pingvin', 'Pindsvin'], emojis: ['🐼', '🍕', '🐧', '🦔'] },
        'Q': { words: ['Quiche', 'Quesadilla', 'Quinoa', 'Quiz'], emojis: ['🥧', '🌮', '🥗', '❓'] },
        'R': { words: ['Raket', 'Regnbue', 'Ring', 'Rose'], emojis: ['🚀', '🌈', '💍', '🌹'] },
        'S': { words: ['Stjerne', 'Snegl', 'Sko', 'Svamp'], emojis: ['⭐', '🐌', '👟', '🍄'] },
        'T': { words: ['Thor', 'Traktor', 'Tiger', 'Træ'], emojis: ['🦸‍♂️', '🚜', '🐯', '🌳'] },
        'U': { words: ['Ulv', 'UFO', 'Uld', 'Ubåd'], emojis: ['🐺', '🛸', '🧶', '🤿'] },
        'V': { words: ['Vindrue', 'Vaffel', 'Vindue', 'Vaskebjørn'], emojis: ['🍇', '🧇', '🪟', '🦝'] },
        'W': { words: ['WC', 'Wienerbrød', 'Walkie-talkie', 'William'], emojis: ['🚽', '🥐', '📻', '👦'] },
        'X': { words: ['Xylofon', 'Xbox', 'X-ray', 'X-wing'], emojis: ['🎹', '🎮', '🩻', '🚀'] },
        'Y': { words: ['Yoghurt', 'Yoga', 'Yakokse', 'Yeti'], emojis: ['🥣', '🧘', '🐂', '🧌'] },
        'Z': { words: ['Zombie', 'Zigzag', 'Zoo', 'Zebra'], emojis: ['🧟', '〰️', '🦁', '🦓'] },
        'Æ': { words: ['Æg', 'Æsel', 'Ært', 'Æske'], emojis: ['🥚', '🫏', '🫛', '📦'] },
        'Ø': { words: ['Ø', 'Ørn', 'Økse', 'Øl'], emojis: ['🏝️', '🦅', '🪓', '🍺'] },
        'Å': { words: ['Åkande', 'Ånd', 'Å', 'Årstid'], emojis: ['🪷', '🧞', '🏞️', '🍂'] }
    };

    const keys = Object.keys(data);
    let appState = 'START'; // START, SHOW_CHAR, SHOW_EXAMPLES, SHOW_ENCOURAGEMENT
    let currentChar = '';
    let roundsCount = 0;
    let encouragementIndex = 0;

    const encouragementMessages = [
        { text: "Hvor er du dygtig, Ricardo Thor!", emoji: "🌟" },
        { text: "Super godt klaret!", emoji: "🚀" },
        { text: "Du er en stjerne til bogstaver!", emoji: "⭐" },
        { text: "Fantastisk arbejde! Du er for sej!", emoji: "🎉" },
        { text: "High five! Du lærer så hurtigt!", emoji: "✋" },
        { text: "Wauw, hvor er du god!", emoji: "🦁" },
        { text: "Du er mega sej til dansk!", emoji: "🏆" },
        { text: "Kæmpe flot! Du kan det hele!", emoji: "🎈" },
        { text: "Bravo Ricardo! Bogstav-mester!", emoji: "👑" },
        { text: "Godt gået! Du er en ægte superhelt!", emoji: "🦸‍♂️" }
    ];

    const displayEl = document.getElementById('display');
    const examplesEl = document.getElementById('examples');
    const emojiEls = [
        document.getElementById('emoji1'),
        document.getElementById('emoji2'),
        document.getElementById('emoji3'),
        document.getElementById('emoji4')
    ];
    const wordEls = [
        document.getElementById('word1'),
        document.getElementById('word2'),
        document.getElementById('word3'),
        document.getElementById('word4')
    ];
    const exampleItems = document.querySelectorAll('.example-item');

    function speak(text, lang = 'da-DK') {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }
    }

    function showLetter() {
        displayEl.style.fontSize = 'clamp(8rem, 25vw, 15rem)';
        displayEl.style.fontFamily = "'Andika', sans-serif";
        
        // Random letter from dataset
        let randomKey = keys[Math.floor(Math.random() * keys.length)];
        
        // 50% uppercase / lowercase chance
        currentChar = Math.random() > 0.5 ? randomKey : randomKey.toLowerCase();
        
        displayEl.innerText = currentChar;
        displayEl.style.display = 'block';
        examplesEl.style.display = 'none';
        appState = 'SHOW_CHAR';
    }

    function nextStep() {
        if (appState === 'START' || appState === 'SHOW_ENCOURAGEMENT') {
            showLetter();
        } else if (appState === 'SHOW_EXAMPLES') {
            // Check if 101 easter egg milestone is reached
            if (roundsCount > 0 && roundsCount % 101 === 0) {
                displayEl.innerHTML = '<div style="font-size: clamp(4.5rem, 12vw, 8rem); margin-bottom: 15px;">💩</div><div style="color: #795548; line-height: 1.3;">mama huele a pedo</div>';
                displayEl.style.fontFamily = "'Nunito', sans-serif";
                displayEl.style.fontSize = "clamp(2rem, 5.5vw, 3.6rem)";
                displayEl.style.display = 'block';
                examplesEl.style.display = 'none';

                speak('mamá huele a pedo', 'es-ES');
                appState = 'SHOW_ENCOURAGEMENT';
            // Check if 20 letters/rounds milestone is reached
            } else if (roundsCount > 0 && roundsCount % 20 === 0) {
                const msg = encouragementMessages[encouragementIndex % encouragementMessages.length];
                encouragementIndex++;

                displayEl.innerHTML = '<div style="font-size: clamp(4.5rem, 12vw, 8rem); margin-bottom: 15px;">' + msg.emoji + '</div><div style="color: #ff4500; line-height: 1.3;">' + msg.text + '</div>';
                displayEl.style.fontFamily = "'Nunito', sans-serif";
                displayEl.style.fontSize = "clamp(2rem, 5.5vw, 3.6rem)";
                displayEl.style.display = 'block';
                examplesEl.style.display = 'none';

                speak(msg.text);
                appState = 'SHOW_ENCOURAGEMENT';
            } else {
                showLetter();
            }
        } else if (appState === 'SHOW_CHAR') {
            const item = data[currentChar.toUpperCase()];
            
            // Speak the character
            speak(item.sound || currentChar.toLowerCase());

            // Pair words and emojis, then shuffle them randomly
            const pairs = item.words.map((w, idx) => ({
                word: w,
                emoji: item.emojis[idx] || ''
            }));
            
            for (let i = pairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
            }

            // Set content for 4 items
            for (let i = 0; i < 4; i++) {
                if (pairs[i]) {
                    emojiEls[i].innerText = pairs[i].emoji;
                    wordEls[i].innerText = pairs[i].word;
                    exampleItems[i].style.display = 'block';
                } else {
                    exampleItems[i].style.display = 'none';
                }
            }

            // Increment letter round counter
            roundsCount++;

            displayEl.style.display = 'none';
            examplesEl.style.display = 'grid';
            appState = 'SHOW_EXAMPLES';
        }
    }

    // Tap/Click background to advance
    document.body.addEventListener('click', nextStep);

    // Tap individual word card to hear it pronounced
    exampleItems.forEach((itemEl, idx) => {
        itemEl.addEventListener('click', (e) => {
            e.stopPropagation();
            const text = wordEls[idx].innerText;
            if (text) {
                speak(text);
                itemEl.style.transform = 'scale(1.08)';
                setTimeout(() => {
                    itemEl.style.transform = '';
                }, 250);
            }
        });
    });
    
    // Initial welcome screen
    displayEl.innerText = "Bienvenido Ricardo Thor!";
    displayEl.style.fontFamily = "'Nunito', sans-serif";
    displayEl.style.fontSize = "clamp(2.5rem, 6vw, 4.5rem)";
</script>

</body>
</html>
